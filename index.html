<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=1920, user-scalable=no">
    <title>Stalker Tizen Test</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: {
                preflight: false,
            }
        }
    </script>
    <script src="js/jquery.min.js"></script>
    <!-- <script src="js/crypto-js.min.js"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/StalkerPortal.js"></script>
    <script>
        // Tizen specific fix: If CryptoJS loaded into exports, move it to window
        if (typeof CryptoJS === 'undefined' && typeof exports !== 'undefined' && exports.CryptoJS) {
            window.CryptoJS = exports.CryptoJS;
        }
    </script>
    <script src="js/navigation.js"></script>
    <script src="js/db.js"></script>
    <script src="js/player.js"></script>

</head>

<body>
    <div class="flex flex-row gap-5 items-center mt-10 mx-10">
        <h1 id="main-title" class="text-5xl font-bold">Stalker Player v1.0</h1>
        <p id="main-author" class="text-[25px]">By Mohamed Sakhri - 2026</p>
        <div id="expiration-info" class="text-2xl font-semibold text-gray-400"></div>
    </div>

    <div id="app-root" class="mt-10 mb-10 mx-10 p-2">
    </div>

    <div class="log-box" id="logBox">

    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        // Redirect console.log to screen
        const logBox = document.getElementById('logBox');
        const originalLog = console.log;
        const originalError = console.error;

        function logToScreen(msg, type = 'log') {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type === 'error') div.style.color = '#ff5555';
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        console.log = function (...args) {
            originalLog.apply(console, args);
            logToScreen(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '));
        };

        console.error = function (...args) {
            originalError.apply(console, args);
            logToScreen(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'error');
        };

        window.onload = function () {
            player.init();
            // App initialized in app.js or here if needed, usually we wait for ready
            if (window.App && window.App.init) {
                window.App.init();
            }
        };
    </script>
</body>

</html>
